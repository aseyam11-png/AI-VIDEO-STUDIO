name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: video_studio_ci
          POSTGRES_USER: video_studio
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U video_studio -d video_studio_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://video_studio:ci-only-password@localhost:5432/video_studio_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,media]"
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
      - name: Verify PostgreSQL migrations
        run: python -m alembic upgrade head
      - name: Verify code quality
        run: ruff check backend tests
      - name: Run test suite
        run: pytest -q
