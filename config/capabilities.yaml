capabilities:
  media_ingestion:
    status: implemented
    tools: [ffprobe, ffmpeg]
  scene_detection:
    status: implemented
    tools: [pyscenedetect]
  transcription:
    status: integrated_optional_worker
    tools: [whisperx]
    locale_priority: [ar, en]
    worker_extra: speech
    default_profile: small
    download_weights_on_explicit_job_only: true
  audio_cleanup:
    status: integrated_external_checkpoint
    tools: [deepfilternet]
    requires_explicit_script_and_checkpoint_path: true
  object_analysis:
    status: integrated_workflow_adapter
    tools: [groundingdino, sam2]
    runtime: comfyui
    requires_exported_api_workflows: true
  video_generation:
    status: integrated_workflow_adapter
    tools: [comfyui, wan22_ti2v_5b]
    max_shot_seconds: 10
    approval_required: true
    requires_gpu_and_exported_api_workflow: true
  motion_graphics:
    status: integrated_template_adapter
    tools: [blender]
    arbitrary_scripts_allowed: false
  timeline:
    status: implemented
    tools: [opentimelineio]
  rendering:
    status: implemented
    tools: [ffmpeg]
  restoration:
    status: integrated_workflow_adapter
    tools: [realesrgan, rife]
    runtime: comfyui
    requires_exported_api_workflows: true
  quality_assurance:
    status: partial
    tools: [ffprobe, ffmpeg]
  gpu_policy:
    max_parallel_heavy_jobs: 1
    runtime: external_comfyui
    auto_download_weights: false
  capcut_handoff:
    status: planned_optional_windows_adapter
    tools: [opentimelineio_export, srt_export, media_manifest]
