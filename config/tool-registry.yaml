tools:
  - id: ffprobe
    purpose: inspect source media metadata and streams
    mode: deterministic
    approval: automatic
  - id: ffmpeg
    purpose: create proxies, trim, concatenate, mix audio and render
    mode: deterministic
    approval: automatic_for_non_destructive_outputs
  - id: pyscenedetect
    purpose: detect candidate shot boundaries
    mode: deterministic
    approval: automatic
  - id: whisperx
    purpose: transcribe and align speech
    mode: model
    approval: automatic_with_user_review_for_final_captions
  - id: sam2
    purpose: object segmentation and tracking
    mode: model
    approval: automatic
  - id: groundingdino
    purpose: text-guided object detection
    mode: model
    approval: automatic
  - id: comfyui
    purpose: run approved, versioned generation workflows
    mode: model_workflow
    approval: required_before_paid_gpu_generation
  - id: blender
    purpose: motion graphics and 3D compositing
    mode: deterministic_project_engine
    approval: required_before_final_render
  - id: opentimelineio
    purpose: timeline representation and interchange
    mode: deterministic
    approval: automatic
  - id: product_identity_lock
    purpose: compare product references with generated shots and flag identity drift
    mode: custom_algorithm
    approval: required_for_scene_acceptance

security:
  deny_shell_access_to_agents: true
  deny_public_model_ports: true
  deny_external_uploads_without_approval: true
  require_project_scoped_paths: true
  require_job_idempotency_key: true
  require_audit_log_for_tool_calls: true
