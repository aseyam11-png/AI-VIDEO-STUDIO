services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_studio}
      POSTGRES_USER: ${POSTGRES_USER:-video_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-video_studio} -d ${POSTGRES_DB:-video_studio}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [studio]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["sh", "-c", "valkey-server --appendonly yes --requirepass \"$$VALKEY_PASSWORD\""]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [studio]

  migrate:
    build: .
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-video_studio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_studio}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [studio]

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-video_studio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_studio}
      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    volumes:
      - ${MEDIA_HOST_PATH:-./data}:/srv/video-studio/data
    networks: [studio]

  worker-cpu:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-video_studio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_studio}
      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
    command:
      ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--queues=cpu", "--concurrency=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    volumes:
      - ${MEDIA_HOST_PATH:-./data}:/srv/video-studio/data
    networks: [studio]

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-video_studio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_studio}
      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
    command:
      ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/var/run/celery/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    volumes:
      - celery_beat_data:/var/run/celery
    networks: [studio]

volumes:
  postgres_data:
  valkey_data:
  celery_beat_data:

networks:
  studio: {}
