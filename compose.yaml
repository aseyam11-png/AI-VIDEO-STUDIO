services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_studio}
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-video_studio_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Set POSTGRES_BOOTSTRAP_PASSWORD in .env}
      DATABASE_MIGRATOR_USER: ${DATABASE_MIGRATOR_USER:-video_studio_migrator}
      DATABASE_MIGRATOR_PASSWORD: ${DATABASE_MIGRATOR_PASSWORD:?Set DATABASE_MIGRATOR_PASSWORD in .env}
      DATABASE_RUNTIME_USER: ${DATABASE_RUNTIME_USER:-video_studio_runtime}
      DATABASE_RUNTIME_PASSWORD: ${DATABASE_RUNTIME_PASSWORD:?Set DATABASE_RUNTIME_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BOOTSTRAP_USER:-video_studio_bootstrap} -d ${POSTGRES_DB:-video_studio}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [studio]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["sh", "-c", "valkey-server --appendonly yes --requirepass \"$$VALKEY_PASSWORD\""]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [studio]

  migrate:
    build: .
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://${DATABASE_MIGRATOR_USER:-video_studio_migrator}:${DATABASE_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_studio}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [studio]

  api:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-AI Video Studio}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEDIA_ROOT: /srv/video-studio/data
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-20}
      DATABASE_URL: postgresql+psycopg://${DATABASE_RUNTIME_USER:-video_studio_runtime}:${DATABASE_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_studio}
      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b-q4_K_M}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-}
      COMFYUI_API_KEY: ${COMFYUI_API_KEY:-}
      COMFYUI_REQUEST_TIMEOUT_SECONDS: ${COMFYUI_REQUEST_TIMEOUT_SECONDS:-120}
      COMFYUI_JOB_TIMEOUT_SECONDS: ${COMFYUI_JOB_TIMEOUT_SECONDS:-7000}
      MODEL_WORKFLOW_REGISTRY: ${MODEL_WORKFLOW_REGISTRY:-/srv/video-studio/data/workflows/registry.json}
      SPEECH_WORKER_ENABLED: ${SPEECH_WORKER_ENABLED:-false}
      DEEPFILTER_SCRIPT: ${DEEPFILTER_SCRIPT:-}
      DEEPFILTER_MODEL_DIR: ${DEEPFILTER_MODEL_DIR:-}
      BLENDER_EXECUTABLE: ${BLENDER_EXECUTABLE:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    volumes:
      - ${MEDIA_HOST_PATH:-./data}:/srv/video-studio/data
    networks: [studio]

  worker-cpu:
    build:
      context: .
      args:
        INSTALL_EXTRAS: ${CPU_WORKER_EXTRAS:-media}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-AI Video Studio}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEDIA_ROOT: /srv/video-studio/data
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-20}
      DATABASE_URL: postgresql+psycopg://${DATABASE_RUNTIME_USER:-video_studio_runtime}:${DATABASE_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_studio}
      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      DEEPFILTER_SCRIPT: ${DEEPFILTER_SCRIPT:-}
      DEEPFILTER_MODEL_DIR: ${DEEPFILTER_MODEL_DIR:-}
      DEEPFILTER_PYTHON: ${DEEPFILTER_PYTHON:-python}
    command:
      ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--queues=cpu", "--concurrency=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    volumes:
      - ${MEDIA_HOST_PATH:-./data}:/srv/video-studio/data
    networks: [studio]

  worker-speech:
    profiles: ["speech"]
    build:
      context: .
      args:
        INSTALL_EXTRAS: media,speech
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-AI Video Studio}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEDIA_ROOT: /srv/video-studio/data
      DATABASE_URL: postgresql+psycopg://${DATABASE_RUNTIME_USER:-video_studio_runtime}:${DATABASE_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_studio}
      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
    command:
      ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--queues=speech", "--concurrency=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    volumes:
      - ${MEDIA_HOST_PATH:-./data}:/srv/video-studio/data
    networks: [studio]

  worker-models:
    build:
      context: .
      args:
        INSTALL_EXTRAS: media
        INSTALL_BLENDER: ${INSTALL_BLENDER:-0}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-AI Video Studio}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEDIA_ROOT: /srv/video-studio/data
      DATABASE_URL: postgresql+psycopg://${DATABASE_RUNTIME_USER:-video_studio_runtime}:${DATABASE_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_studio}
      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-}
      COMFYUI_API_KEY: ${COMFYUI_API_KEY:-}
      COMFYUI_REQUEST_TIMEOUT_SECONDS: ${COMFYUI_REQUEST_TIMEOUT_SECONDS:-120}
      COMFYUI_JOB_TIMEOUT_SECONDS: ${COMFYUI_JOB_TIMEOUT_SECONDS:-7000}
      MODEL_WORKFLOW_REGISTRY: ${MODEL_WORKFLOW_REGISTRY:-/srv/video-studio/data/workflows/registry.json}
      BLENDER_EXECUTABLE: ${BLENDER_EXECUTABLE:-}
    command:
      ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--queues=models", "--concurrency=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    volumes:
      - ${MEDIA_HOST_PATH:-./data}:/srv/video-studio/data
    networks: [studio]

  worker-control:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-AI Video Studio}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEDIA_ROOT: /srv/video-studio/data
      DATABASE_URL: postgresql+psycopg://${DATABASE_RUNTIME_USER:-video_studio_runtime}:${DATABASE_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_studio}
      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
    command:
      ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--queues=control", "--concurrency=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    networks: [studio]

  scheduler:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-AI Video Studio}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEDIA_ROOT: /srv/video-studio/data
      DATABASE_URL: postgresql+psycopg://${DATABASE_RUNTIME_USER:-video_studio_runtime}:${DATABASE_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_studio}
      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
    command:
      ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/var/run/celery/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    volumes:
      - celery_beat_data:/var/run/celery
    networks: [studio]

volumes:
  postgres_data:
  valkey_data:
  celery_beat_data:

networks:
  studio: {}
